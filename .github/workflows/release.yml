name: Build

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "2"
  RC_PARAMS: "seed=42"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unix:
    name: Build and test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
            shared: "ON"
            asm: AUTO
            arch: x86_64
            platform_flags: ""
            benchmarks: "ON"
            package: true
            archive: linux-x86_64
          - os: ubuntu-latest
            compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release
            shared: "OFF"
            asm: GENERIC
            arch: x86_64
            platform_flags: ""
            benchmarks: "OFF"
            package: false
          - os: macos-15
            compiler: AppleClang
            cc: clang
            cxx: clang++
            build_type: Debug
            shared: "ON"
            asm: AUTO
            arch: arm64
            platform_flags: -DCMAKE_OSX_ARCHITECTURES=arm64
            benchmarks: "OFF"
            package: true
            archive: macos-arm64
          - os: macos-15-intel
            compiler: AppleClang
            cc: clang
            cxx: clang++
            build_type: Debug
            shared: "ON"
            asm: GENERIC
            arch: x86_64
            platform_flags: -DCMAKE_OSX_ARCHITECTURES=x86_64
            benchmarks: "OFF"
            package: true
            archive: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Assert native macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Initialize pinned submodules
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P scripts/update_math_stack.cmake
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Configure all tests
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLMX_BUILD_STATIC=ON -DLMX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON -DLMX_BUILD_TESTS=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON
          -DLMCAS_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DLMMC_BUILD_EXAMPLES=OFF
          -DLMMC_BUILD_SHARED=${{ matrix.shared }} -DLMCAS_LMMP_ASM=${{ matrix.asm }}
          -DLMX_ENABLE_LTO=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          -DLMX_FAST_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
          -DCMAKE_INSTALL_LIBDIR=lib ${{ matrix.platform_flags }}
      - name: Build all targets
        run: cmake --build build/strict-debug --parallel 2
      - name: Run all tests
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Check relocated static-PIC CAS package
        if: runner.os == 'Linux' && matrix.shared == 'OFF'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          common=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib)
          cmake -S external/LMCAS -B "$work/producer" "${common[@]}" -DLMMC_BUILD_SHARED=OFF -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=${{ matrix.asm }}
          python3 external/LMCAS/LMMC/cmake/check_package.py --project lmcas --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["passed"]' "$work/check/package_report.json"
          rm -rf "$work/producer" "$work/check"
      - name: Check native relocated standalone packages
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          common=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib)
          common+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}" "-DCMAKE_OTOOL=$(xcrun --find otool)" "-DCMAKE_INSTALL_NAME_TOOL=$(xcrun --find install_name_tool)")
          cmake -S external/LMCAS -B "$work/producer" "${common[@]}" -DLMMC_BUILD_SHARED=ON -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=${{ matrix.asm }}
          python3 external/LMCAS/LMMC/cmake/check_package.py --project lmcas --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,subprocess,sys; report=json.load(open(sys.argv[1])); assert report["passed"]; files=[t["file"] for t in report["targets"].values() if t["type"] == "SHARED_LIBRARY"]; assert files; assert all(subprocess.check_output(["lipo", "-archs", f], text=True).strip() == sys.argv[2] for f in files)' "$work/check/package_report.json" "${{ matrix.arch }}"
          rm -rf "$work/producer" "$work/check"
          cmake -S external/LMCAS/LMMC -B "$work/producer" "${common[@]}" -DLMMC_BUILD_SHARED=ON -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_WARNINGS_AS_ERRORS=ON -DLMMC_LMMP_ASM=${{ matrix.asm }}
          python3 external/LMCAS/LMMC/cmake/check_package.py --project lmmc --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,subprocess,sys; report=json.load(open(sys.argv[1])); assert report["passed"]; files=[t["file"] for t in report["targets"].values() if t["type"] == "SHARED_LIBRARY"]; assert files; assert all(subprocess.check_output(["lipo", "-archs", f], text=True).strip() == sys.argv[2] for f in files)' "$work/check/package_report.json" "${{ matrix.arch }}"
          rm -rf "$work/producer" "$work/check"
      - name: Configure production package
        if: matrix.package
        run: >-
          cmake -S . -B build/strict-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DLMX_BUILD_STATIC=ON
          -DBUILD_TESTING=OFF -DLMX_BUILD_TESTS=OFF
          -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMMC_BUILD_TESTS=OFF
          -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMX_ENABLE_SANITIZERS=OFF -DLMX_ENABLE_TSAN=OFF -DLMX_ENABLE_CLANG_TIDY=OFF
          -DLMCAS_ENABLE_SANITIZERS=OFF -DLMCAS_ENABLE_TSAN=OFF -DLMCAS_ENABLE_COVERAGE=OFF -DLMCAS_ENABLE_CLANG_TIDY=OFF
          -DLMMC_ENABLE_SANITIZERS=OFF -DLMMC_ENABLE_TSAN=OFF -DLMMC_ENABLE_COVERAGE=OFF -DLMMC_ENABLE_CLANG_TIDY=OFF
          -DLMX_WARNINGS_AS_ERRORS=ON
          -DLMX_ENABLE_LTO=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          -DLMX_FAST_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
          -DLMCAS_LMMP_ASM=${{ matrix.asm }} -DCMAKE_INSTALL_LIBDIR=lib ${{ matrix.platform_flags }}
      - name: Build production package
        if: matrix.package
        run: cmake --build build/strict-debug --config Release --target lamina laminac_s lamina_runtime_s --parallel 2
      - name: Install production package
        if: matrix.package
        run: cmake --install build/strict-debug --config Release --prefix "$GITHUB_WORKSPACE/package" --component LaminaPackage
      - name: Check relocated Linux runtime
        if: matrix.package && runner.os == 'Linux'
        run: env -u LD_LIBRARY_PATH package/bin/lamina examples/fib.lm
      - name: Check native relocatable macOS runtime
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for binary in package/bin/* package/lib/*; do
            test "$(lipo -archs "$binary")" = "${{ matrix.arch }}"
          done
          for binary in package/bin/*; do
            otool -L "$binary" | awk 'NR > 1 { print $1 }' | while read -r dependency; do
              case "$dependency" in
                *liblamina*.dylib|*liblmcas*.dylib|*liblmmc*.dylib|*liblmmp*.dylib)
                  case "$dependency" in
                    @rpath/*) ;;
                    *) echo "Non-relocatable first-party dependency: $dependency" >&2; exit 1 ;;
                  esac
                  ;;
              esac
            done
          done
          test "$(otool -D package/bin/liblamina.dylib | sed -n '2p')" = "@rpath/liblamina.dylib"
          test "$(otool -D package/bin/liblmcas.dylib | sed -n '2p')" = "@rpath/liblmcas.dylib"
          test "$(otool -D package/bin/liblmmc.dylib | sed -n '2p')" = "@rpath/liblmmc.dylib"
          test "$(otool -D package/bin/liblmmp.1.dylib | sed -n '2p')" = "@rpath/liblmmp.1.dylib"
          otool -l package/bin/lamina | awk '/cmd LC_RPATH/ { getline; getline; if ($2 == "@loader_path") found = 1 } END { exit !found }'
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH package/bin/lamina examples/fib.lm
      - name: Create release archive
        if: matrix.package
        run: tar -czf "lamina-${{ matrix.archive }}.tar.gz" -C package .
      - name: Upload platform archive
        if: matrix.package
        uses: actions/upload-artifact@v7
        with:
          name: lamina-${{ matrix.archive }}
          path: lamina-${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build and test (Windows UCRT64, ${{ matrix.build_type }}, shared=${{ matrix.shared }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            shared: "ON"
          - build_type: Debug
            shared: "OFF"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Initialize pinned submodules
        shell: pwsh
        run: cmake -DROOT="$env:GITHUB_WORKSPACE" -P scripts/update_math_stack.cmake
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: toolchain:p cmake:p ninja:p python:p
      - name: Configure all tests
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLMX_BUILD_STATIC=ON -DLMX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON -DLMX_BUILD_TESTS=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON
          -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF
          -DLMMC_BUILD_SHARED=${{ matrix.shared }} -DLMCAS_LMMP_ASM=AUTO
          -DLMX_ENABLE_LTO=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          -DLMX_FAST_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
          -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build all targets
        run: cmake --build build/strict-debug --parallel 2
      - name: Run all tests
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Check relocated standalone CAS package
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          common=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib)
          cmake -S external/LMCAS -B "$work/producer" "${common[@]}" -DLMMC_BUILD_SHARED=ON -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=AUTO
          python3 external/LMCAS/LMMC/cmake/check_package.py --project lmcas --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["passed"]' "$work/check/package_report.json"
          rm -rf "$work/producer" "$work/check"
      - name: Check external shared cmocka runtime deployment
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/cmocka.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          git clone https://gitlab.com/cmocka/cmocka.git "$work/source"
          git -C "$work/source" checkout --detach cmocka-2.0.2
          for generator in Ninja "Ninja Multi-Config"; do
            cmake -S "$work/source" -B "$work/producer" -G "$generator" \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$work/prefix" \
              -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON \
              -DUNIT_TESTING=OFF -DWITH_EXAMPLES=OFF -DWITH_CMOCKERY_SUPPORT=OFF \
              -DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=TRUE
            cmake --build "$work/producer" --config Debug --parallel 2
            cmake --install "$work/producer" --config Debug
            cmake -S external/LMCAS/LMMC -B "$work/consumer" -G "$generator" \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DLMMC_BUILD_TESTS=ON \
              -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON \
              -Dcmocka_DIR="$work/prefix/lib/cmake/cmocka"
            cmake --build "$work/consumer" --config Debug \
              --target lmmc_test_init lmmc_test_dense --parallel 2
            ctest --test-dir "$work/consumer" -C Debug --parallel 2 --output-on-failure \
              --no-tests=error -R '^lmmc_test_(init|dense)$'
            if [ "$generator" = "Ninja Multi-Config" ]; then
              cmake --build "$work/consumer" --config Release \
                --target lmmc_test_init lmmc_test_dense --parallel 2
              ctest --test-dir "$work/consumer" -C Release --parallel 2 --output-on-failure \
                --no-tests=error -R '^lmmc_test_(init|dense)$'
            fi
            rm -rf "$work/producer" "$work/prefix" "$work/consumer"
          done
      - name: Configure production package
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        run: >-
          cmake -S . -B build/strict-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DLMX_BUILD_STATIC=ON
          -DBUILD_TESTING=OFF -DLMX_BUILD_TESTS=OFF
          -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMMC_BUILD_TESTS=OFF
          -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMX_ENABLE_SANITIZERS=OFF -DLMX_ENABLE_TSAN=OFF -DLMX_ENABLE_CLANG_TIDY=OFF
          -DLMCAS_ENABLE_SANITIZERS=OFF -DLMCAS_ENABLE_TSAN=OFF -DLMCAS_ENABLE_COVERAGE=OFF -DLMCAS_ENABLE_CLANG_TIDY=OFF
          -DLMMC_ENABLE_SANITIZERS=OFF -DLMMC_ENABLE_TSAN=OFF -DLMMC_ENABLE_COVERAGE=OFF -DLMMC_ENABLE_CLANG_TIDY=OFF
          -DLMX_WARNINGS_AS_ERRORS=ON
          -DLMX_ENABLE_LTO=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          -DLMX_FAST_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
          -DLMCAS_LMMP_ASM=AUTO -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build production package
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        run: cmake --build build/strict-debug --config Release --target lamina laminac_s lamina_runtime_s --parallel 2
      - name: Install production package
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        run: cmake --install build/strict-debug --config Release --prefix "$(cygpath -m "$GITHUB_WORKSPACE")/package" --component LaminaPackage
      - name: Create release archive
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath lamina-windows-x64.zip
      - name: Upload platform archive
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: lamina-windows-x64
          path: lamina-windows-x64.zip
          if-no-files-found: error

  sanitizers:
    name: Root and math stack ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            flags: -DLMX_ENABLE_SANITIZERS=ON -DLMX_ENABLE_TSAN=OFF
            asan_options: detect_leaks=1:strict_string_checks=1
            ubsan_options: print_stacktrace=1:halt_on_error=1
            tsan_options: ""
          - name: TSan
            flags: -DLMX_ENABLE_SANITIZERS=OFF -DLMX_ENABLE_TSAN=ON
            asan_options: ""
            ubsan_options: ""
            tsan_options: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Initialize pinned submodules
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P scripts/update_math_stack.cmake
      - name: Configure all tests
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DLMX_BUILD_STATIC=ON -DLMX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON -DLMX_BUILD_TESTS=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON
          -DLMX_ENABLE_LTO=OFF -DLMCAS_LMMP_ASM=GENERIC -DLMMC_BUILD_SHARED=ON
          -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF ${{ matrix.flags }}
      - name: Build all targets
        run: cmake --build build/strict-debug --parallel 2
      - name: Run all tests
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/external/LMCAS/.github/lsan.supp
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --test-dir build/strict-debug --parallel 1 --output-on-failure --no-tests=error --timeout 600

  installed-package:
    name: Relocated standalone CAS and MC packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Initialize pinned submodules
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P scripts/update_math_stack.cmake
      - name: Check standalone Release packages from source snapshot
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 external/LMCAS/LMMC/cmake/check_package.py --project lmcas --source-root . --snapshot-dir "$work/source"
          cd "$work/source"
          for project in lmcas lmmc; do
            source=external/LMCAS
            flags=(-DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=AUTO)
            if [ "$project" = lmmc ]; then
              source=external/LMCAS/LMMC
              flags=(-DLMMC_WARNINGS_AS_ERRORS=ON -DLMMC_LMMP_ASM=AUTO)
            fi
            cmake -S "$source" -B "$work/producer" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib -DLMMC_BUILD_SHARED=ON \
              -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF "${flags[@]}"
            python3 external/LMCAS/LMMC/cmake/check_package.py --project "$project" \
              --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
            python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["passed"]' "$work/check/package_report.json"
            rm -rf "$work/producer" "$work/check"
          done

  static-analysis:
    name: Clang-Tidy root and math stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Initialize pinned submodules
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P scripts/update_math_stack.cmake
      - name: Install C++23-capable clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-19
      - name: Configure static analysis
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF -DLMX_BUILD_TESTS=OFF -DLMX_BUILD_STATIC=ON
          -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMMC_BUILD_TESTS=OFF
          -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF
          -DLMX_WARNINGS_AS_ERRORS=ON -DLMX_ENABLE_LTO=OFF -DLMX_ENABLE_CLANG_TIDY=ON
          -DLMX_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-19
          -DLMCAS_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-19 -DLMMC_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-19
          -DLMCAS_LMMP_ASM=GENERIC
      - name: Analyze production targets
        run: cmake --build build/strict-debug --target lamina laminac_s lamina_runtime_s --parallel 2

  math-stack-coverage:
    name: Math stack coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: external/LMCAS
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage tool
        run: python3 -m pip install gcovr==8.6
      - name: Configure coverage separately from sanitizers
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B "$GITHUB_WORKSPACE/build/strict-debug" -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON
          -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_ENABLE_COVERAGE=ON
          -DLMCAS_ENABLE_SANITIZERS=OFF -DLMCAS_ENABLE_TSAN=OFF
          -DLMMC_ENABLE_SANITIZERS=OFF -DLMMC_ENABLE_TSAN=OFF -DLMCAS_LMMP_ASM=GENERIC
      - name: Build full instrumented stack
        run: cmake --build "$GITHUB_WORKSPACE/build/strict-debug" --parallel 2
      - name: Run all math tests
        run: ctest --test-dir "$GITHUB_WORKSPACE/build/strict-debug" --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Generate coverage report
        if: always()
        run: >-
          python3 -m gcovr --config .gcovr.cfg --object-directory "$GITHUB_WORKSPACE/build/strict-debug"
          --json-summary "$GITHUB_WORKSPACE/build/strict-debug/coverage-summary.json"
          --xml-pretty --xml "$GITHUB_WORKSPACE/build/strict-debug/coverage.xml"
          --html-details "$GITHUB_WORKSPACE/build/strict-debug/coverage.html"
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: math-stack-coverage
          path: |
            build/strict-debug/coverage-summary.json
            build/strict-debug/coverage.xml
            build/strict-debug/coverage.html
            build/strict-debug/coverage.*.html

  create-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-unix
      - build-windows
      - sanitizers
      - installed-package
      - static-analysis
      - math-stack-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: lamina-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/lamina-linux-x86_64.tar.gz
            release-artifacts/lamina-macos-arm64.tar.gz
            release-artifacts/lamina-macos-x86_64.tar.gz
            release-artifacts/lamina-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
