name: Build

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:



jobs:
  build-unix:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux-x64
            build_type: Release
            so_ext: .so
            use_asm: 'ON'
          - os: macos-latest
            archive: macos
            build_type: Debug
            so_ext: .dylib
            use_asm: 'OFF'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLMX_BUILD_STATIC=ON -DLMX_BUILD_TESTS=ON -DUSE_ASM=${{ matrix.use_asm }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p package/bin package/lib
          cp "$(find build -maxdepth 3 -name "lamina" -type f | head -1)" package/bin/
          find build -type f \( -name '*${{ matrix.so_ext }}' -o -name '*${{ matrix.so_ext }}.*' \) -exec cp {} package/bin/ \;
          while IFS= read -r f; do
            cp "$f" package/lib/
          done < <(find build -type f \( -name "liblaminac.a" -o -name "liblamina_runtime.a" \))

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamina-${{ matrix.archive }}
          path: package/

  build-windows:
    name: Build and test (windows-latest, MinGW)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLMX_BUILD_STATIC=ON -DLMX_BUILD_TESTS=ON -DUSE_ASM=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 4

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p package/bin package/lib
          cp build/lamina.exe package/bin/
          find build -type f -name '*.dll' -exec cp {} package/bin/ \;
          find build -type f \( -name 'liblaminac.a' -o -name 'liblamina_runtime.a' \) -exec cp {} package/lib/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamina-windows-x64
          path: package/
