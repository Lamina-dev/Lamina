name: Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:



jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            archive: linux-x64
            ext: ''
            so_ext: .so
            lib_ext: .a
#          - os: macos-latest
#            archive: macos-x64
#            ext: ''
#            so_ext: .dylib
#            lib_ext: .a
#          - os: windows-latest
#            archive: windows-x64
#            ext: .exe
#            so_ext: .dll
#            lib_ext: .lib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

#      - name: Install NASM (macOS)
#        if: runner.os == 'macOS'
#        run: brew install nasm

#      - name: Install NASM (Windows)
#        if: runner.os == 'Windows'
#        shell: bash
#        run: |
#          curl -fsSL -o nasm.zip "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"
#          unzip -o nasm.zip
#          echo "$GITHUB_WORKSPACE/nasm-2.16.03/" >> "$GITHUB_PATH"

#      - name: Set up MSVC environment
#        if: runner.os == 'Windows'
#        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DLMX_BUILD_STATIC=ON -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DLMX_BUILD_STATIC=ON
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p package/bin

          # Executable
          cp "$(find build -maxdepth 3 -name "lamina${{ matrix.ext }}" -type f | head -1)" package/bin/

          # Shared library (put alongside executable so it can be found)
          cp "$(find build -maxdepth 3 -name "*laminaCore*${{ matrix.so_ext }}" -type f | head -1)" package/bin/

          # Static libraries
          mkdir -p package/lib
          while IFS= read -r f; do
            cp "$f" package/lib/
          done < <(find build -maxdepth 3 \( -name "laminac${{ matrix.lib_ext }}" -o -name "lamina_runtime${{ matrix.lib_ext }}" \) -type f)

#          # On Windows, also grab import lib for laminaCore
#          if [ "${{ runner.os }}" = "Windows" ]; then
#            cp "$(find build -maxdepth 3 -name "laminaCore.lib" -type f | head -1)" package/lib/
#          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamina-${{ matrix.archive }}
          path: package/
